server.port=8011
spring.application.name=trainmind-agent-tools

spring.ai.mcp.server.name=trainmind-ticket-tools
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=TrainMind只读票务工具服务，不提供下单、扣库存或支付能力。
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false

management.endpoints.web.exposure.include=health,info
trainmind.tools.business-base-url=${TRAINMIND_BUSINESS_BASE_URL:http://127.0.0.1:18002}
trainmind.tools.max-results=${TRAINMIND_MCP_MAX_RESULTS:100}
