# 应用服务 WEB 访问端口
server.port=8001
server.servlet.context-path=/member
spring.application.name=member

# 数据库连接
spring.datasource.url=${TRAIN_MEMBER_DB_URL:jdbc:mysql://localhost/member?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${TRAIN_DB_USERNAME:root}
spring.datasource.password=${TRAIN_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/**/*.xml

#sentinel控台：https://github.com/alibaba/spring-cloud-alibaba/wiki/Sentinel
spring.cloud.sentinel.transport.port=8719
spring.cloud.sentinel.transport.dashboard=localhost:18080

