services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trainmind-pgvector
    environment:
      POSTGRES_DB: trainmind
      POSTGRES_USER: trainmind
      POSTGRES_PASSWORD: ${TRAINMIND_POSTGRES_PASSWORD:?set TRAINMIND_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - trainmind_pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainmind -d trainmind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trainmind_pgvector:
