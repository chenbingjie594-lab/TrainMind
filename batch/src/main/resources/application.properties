server.port=8003
server.servlet.context-path=/batch
spring.application.name=batch

# 数据库连接
spring.datasource.url=${TRAIN_BATCH_DB_URL:jdbc:mysql://localhost/batch?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${TRAIN_DB_USERNAME:root}
spring.datasource.password=${TRAIN_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mybatis xml路径
mybatis.mapper-locations=classpath:/mapper/**/*.xml
